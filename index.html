<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-SAN 4 Super App</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: #f3f4f6;
        }
        .iframe-container {
            position: absolute;
            top: -36px; /* ดึงขึ้นไปซ่อนแถบแจ้งเตือนของ Google */
            left: 0;
            width: 100%;
            height: calc(100% + 36px); /* บวกความสูงชดเชย เพื่อดึงแถบเมนูด้านล่างให้กลับมาพอดีจอ */
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbzGvSr45yLfX3D1CS1c-37r3Qrv6IKKmYpBXSnWm0AKwuwbrspte4X1-hhz-Crmlx7z-g/exec"></iframe>
    </div>
</body>
</html>
